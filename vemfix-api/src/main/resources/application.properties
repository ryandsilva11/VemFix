spring.application.name=vemfix-api
server.port=8080

# ===============================
# Banco de Dados (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/vemfix_db?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Hibernate / JPA
# ===============================
# 'update': cria ou atualiza as tabelas automaticamente no MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html